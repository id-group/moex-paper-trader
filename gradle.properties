# JVM-аргументы демона Gradle (одной строкой — продолжения строк в .properties ненадёжны).
# add-exports необходимы Google Java Format (Spotless) для доступа к внутренним API javac.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m --add-exports=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED

# Параллельная сборка и кэш сборки ускоряют итерации.
org.gradle.parallel=true
org.gradle.caching=true
