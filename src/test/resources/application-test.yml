# Профиль тестов: фиксированные refresh-токены вместо переменных окружения
# и отключённый планировщик исполнения, чтобы фоновые тики не меняли заявки тестов.
emulator:
  execution:
    scheduler-enabled: false
  brokers:
    bks:
      auth:
        refresh-tokens:
          - token: test-trade-refresh-token
            client-id: trade-api-write
          - token: test-read-refresh-token
            client-id: trade-api-read
