# Конфигурация эмулятора брокера.
# Секреты — только из переменных окружения (значения по умолчанию пустые).
server:
  port: 8080

spring:
  application:
    name: broker-emulator
  # PostgreSQL 18: параметры переопределяются переменными окружения, пароль по умолчанию пустой.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/papertrader}
    username: ${DB_USERNAME:papertrader}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      # Схему задают только миграции Flyway; Hibernate лишь сверяет с ней сущности.
      ddl-auto: validate
  jackson:
    datatype:
      datetime:
        write-dates-as-timestamps: false

# Actuator: наружу выставлен только health (решение по временному пункту №1, этап 2).
management:
  endpoints:
    web:
      exposure:
        include: health

emulator:
  portfolio:
    account: PAPER-0001
    initial-cash: 1000000.00
    currency: RUB
  marketdata:
    # Режим рыночных данных: STUB (заглушка, по умолчанию) / LIVE / RECORD / REPLAY.
    mode: STUB
    # REPLAY: начало таймлайна (ISO-8601, опционально — по умолчанию с первого снапшота записи),
    # скорость воспроизведения, seed детерминированных моделей и шаг таймера.
    replay:
      speed: 1.0
      seed: 42
      tick-ms: 100
    # RECORD: сколько дней хранить снапшоты рыночных данных (retention).
    retention-days: 7
    # Торговый календарь MOEX ISS (кэш в БД): движок/рынок/режим, эталонный инструмент
    # (по его торговым дням строится календарь), базовый адрес ISS и таймауты.
    calendar-engine: stock
    calendar-market: shares
    calendar-board: TQBR
    calendar-security: SBER
    iss-base-url: https://iss.moex.com
    connect-timeout-ms: 2000
    read-timeout-ms: 5000
    # Fallback-окно сессии (МСК), если биржа не отдала границы из своих данных
    # (решение владельца: границы сессии берутся из API биржи — минутные свечи).
    session-open: "10:00"
    session-close: "18:50"
    stub:
      instruments:
        - ticker: SBER
          class-code: TQBR
          type: STOCK
          short-name: Сбербанк
          display-name: Сбербанк
          isin: RU0009029540
          lot-size: 10
          minimum-step: 0.01
          currency: RUB
          base-price: 285.50
        - ticker: GAZP
          class-code: TQBR
          type: STOCK
          short-name: Газпром
          display-name: Газпром
          isin: RU0007661625
          lot-size: 10
          minimum-step: 0.01
          currency: RUB
          base-price: 165.20
        - ticker: LKOH
          class-code: TQBR
          type: STOCK
          short-name: ЛУКОЙЛ
          display-name: ЛУКОЙЛ
          isin: RU0009024277
          lot-size: 1
          minimum-step: 0.5
          currency: RUB
          base-price: 7100.00
        - ticker: SiU6
          class-code: SPBFUT
          type: FUTURES
          short-name: Si-12.26
          display-name: Фьючерс на доллар США
          isin: ""
          lot-size: 1
          minimum-step: 1
          currency: RUB
          base-price: 90000
  # HTTP-клиенты рыночных данных (этап 4). Токен AlgoPack — только env, никогда в конфиг.
  algoapi:
    base-url: https://algo-api.moex.com
    token: ${ALGO_PACK_TOKEN:}
    connect-timeout-ms: 2000
    read-timeout-ms: 5000
    max-retries: 2
    retry-delay-ms: 500
    engine: stock
    market: shares
    board: TQBR
  iss:
    # Домен iss.moex.ru выведен из эксплуатации; рабочий — iss.moex.com.
    base-url: https://iss.moex.com
    connect-timeout-ms: 2000
    read-timeout-ms: 5000
    max-retries: 2
    retry-delay-ms: 500
    engine: stock
    market: shares
    board: TQBR
  brokers:
    bks:
      # Префикс монтирования API брокера: контрактный /api/v1/x -> /api/bks/v1/x.
      base-path: /api/bks
      auth:
        access-token-ttl: 24h
        refresh-token-ttl: 90d
        # Решение владельца: refresh-токены только из переменных окружения.
        refresh-tokens:
          - token: ${BKS_REFRESH_TOKEN_TRADE:}
            client-id: trade-api-write
          - token: ${BKS_REFRESH_TOKEN_READ:}
            client-id: trade-api-read
      rate-limit:
        enabled: false
        requests-per-second: 10

logging:
  level:
    root: INFO
    ru.moex.papertrader: DEBUG
